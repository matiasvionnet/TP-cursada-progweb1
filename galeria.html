<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galería | Observar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="recursos/style.css">

</head>

<body>

    <header>

        <nav class="navbar">

            <a href="index.html" class="logo">
                OBSERVAR
                <span>desde otro punto de vista</span>
            </a>

            <button type="button" id="btn-menu" class="btn-menu" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul class="menu" id="menu">

                <li>
                    <a href="index.html">Inicio</a>
                </li>

                <li>
                    <a href="galeria.html">Galería</a>
                </li>

                <li>
                    <a href="index.html#sobre-mi">
                        Sobre mí
                    </a>
                </li>

                <li>
                    <a href="contacto.html">
                        Contacto
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <main class="pagina-galeria">

        <section class="encabezado-galeria">

            <p class="etiqueta">
                01 / PORTFOLIO
            </p>

            <h1>
                Galería
            </h1>

            <p>
                Una selección de fotografías
                desde diferentes perspectivas.
            </p>

        </section>

        <section class="filtros">

            <button class="filtro activo"
                    data-categoria="todos">
                Todas
            </button>

            <button class="filtro"
                    data-categoria="automoviles">
                Automóviles
            </button>

            <button class="filtro"
                    data-categoria="comida">
                Comida
            </button>

            <button class="filtro"
                    data-categoria="moda">
                Moda
            </button>
            
            <button class="filtro"
                    data-categoria="autor">
                Autor
            </button>

        </section>

        <div class="buscador">
            <input type="search" id="buscador" name="buscador"
                   placeholder="Buscar por nombre o categoría..."
                   aria-label="Buscar fotografías">
        </div>

        <p class="contador-resultados" id="contador" aria-live="polite"></p>

        <section class="galeria" id="galeria"></section>

        <p class="sin-resultados" id="sin-resultados" hidden>
            No se encontraron fotografías para tu búsqueda.
        </p>

    </main>


    <footer>

        <span>Charlemos</span>

        <div class="contacto-footer">

            <a href="https://www.instagram.com/matias_vionnet/">Instagram</a>
            <a href="mailto:matias.vionnet@gmail.com">Email</a>
            <a href="tel:+541138188402">Teléfono</a>

        </div>

        <span>
            © 2026 Observar
        </span>

    </footer>
    <script src="recursos/funciones.js"></script>
</body>

</html>
